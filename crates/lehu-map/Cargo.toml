[package]
name = "lehu-map"
description = "The offline map: OpenStreetMap tiles from the SD card, composed on the video plane, scrolled and zoomed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lehu-drm = { path = "../lehu-drm" }
lehu-image = { path = "../lehu-image" }
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[build-dependencies]
cc = "1"

[dev-dependencies]
png = "0.18.1"
