[package]
name = "lehu-cp"
description = "CarPlay: the wired USB trigger (usbmux, lockdown, iAP2, MFi), the wireless bootstrap (iAP2 over Bluetooth, mDNS, the access point handoff) and the AV stack (pairing, RTSP, the streams) the main loop drives as a session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lehu-bt = { path = "../lehu-bt" }
lehu-core = { path = "../lehu-core" }
lehu-input = { path = "../lehu-input" }
lehu-session = { path = "../lehu-session" }
lehu-usb = { path = "../lehu-usb" }
lehu-video = { path = "../lehu-video" }
lehu-wifi = { path = "../lehu-wifi" }
libc = "0.2"
log = "0.4"
# The CarPlay crypto, pure Rust: the pairing (SRP-6a, X25519, Ed25519,
# HKDF-SHA512), the MFiSAP (AES-128-CTR) and every stream's AEAD.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
ed25519-dalek = { version = "2", default-features = false }
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
hkdf = { version = "0.12", default-features = false }
hmac = { version = "0.12", default-features = false }
aes = { version = "0.8", default-features = false }
ctr = { version = "0.9", default-features = false }
num-bigint = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }
subtle = { version = "2", default-features = false }
getrandom = { version = "0.3", default-features = false, features = ["std"] }
# The lockdown link only: its TLS 1.2 client with an RSA certificate, and
# the RSA keys and X.509 certificates a first pairing makes. OpenSSL is on
# the image for Android Auto already.
openssl = "0.10"
