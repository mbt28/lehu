# On a version tag: make the Debian source package, build the Raspberry
# Pi package from it (arm64, Raspberry Pi OS Trixie), attach both to the
# GitHub release, and publish the binary package to the apt repository on
# GitHub Pages (the gh-pages branch).
#
# One-time setup:
# 1. A signing key without a passphrase (the workflow signs unattended):
#    gpg --batch --passphrase '' --quick-gen-key "LEHU apt repository" ed25519 sign never
# 2. Two repository secrets: LEHU_GPG_PRIVATE_KEY, the output of
#    gpg --armor --export-secret-keys <fingerprint>, and LEHU_GPG_KEY_ID,
#    the fingerprint.
# 3. GitHub Pages serving the gh-pages branch (Settings > Pages), once the
#    first release has created it.
name: Release

on:
  push:
    tags: ["v*"]
  # Run by hand on a branch: builds and tests the packages, publishes
  # nothing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.suite }})
    runs-on: ubuntu-24.04-arm
    container: debian:${{ matrix.suite }}
    strategy:
      matrix:
        suite: [trixie]
    steps:
      # git first, so that the checkout is a repository (git archive).
      - name: Git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v7

      # The archive's key as Raspberry Pi OS ships it (raspberrypi-archive-
      # keyring): the key file on archive.raspberrypi.com is an old export
      # with SHA-1 bindings, which Trixie's apt rejects.
      - name: Raspberry Pi OS archive
        run: |
          install -m 0644 .github/raspberrypi-archive-keyring.pgp /usr/share/keyrings/
          echo "deb [signed-by=/usr/share/keyrings/raspberrypi-archive-keyring.pgp] http://archive.raspberrypi.com/debian ${{ matrix.suite }} main" \
            > /etc/apt/sources.list.d/raspi.list
          apt-get update

      - name: Tools
        run: |
          apt-get install -y --no-install-recommends build-essential dpkg-dev \
            debhelper python3 xz-utils rustup
          rustup set profile minimal
          rustup default stable

      - name: Source package
        run: packaging/debian/build-source.sh ${{ matrix.suite }} dist

      # Built from the source package, as anyone rebuilding it would; the
      # tests run as part of the build.
      - name: Binary package
        id: files
        run: |
          mkdir -p build
          dpkg-source -x dist/*.dsc build/lehu
          cd build/lehu
          apt-get build-dep -y ./
          dpkg-buildpackage -b -us -uc
          mv ../*.deb ../../dist/
          cd ../../dist
          echo "deb=$(echo *.deb)" >> "$GITHUB_OUTPUT"
          echo "dsc=$(echo *.dsc)" >> "$GITHUB_OUTPUT"
          echo "debian=$(echo *.debian.tar.xz)" >> "$GITHUB_OUTPUT"
          echo "orig=$(echo *.orig.tar.xz)" >> "$GITHUB_OUTPUT"
          echo "vendor=$(echo *.orig-cargo-vendor.tar.xz)" >> "$GITHUB_OUTPUT"

      # Each file on its own, not zipped (an artifact per file).
      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.files.outputs.deb }}
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.files.outputs.dsc }}
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.files.outputs.debian }}
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.files.outputs.orig }}
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.files.outputs.vendor }}
          archive: false

  publish:
    name: Publish
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: lehu_*
          merge-multiple: true
          path: dist

      - name: Files
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          ls -l dist

      - name: Attach to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.deb
            dist/*.dsc
            dist/*.tar.xz

      - name: Update the apt repository
        env:
          LEHU_GPG_PRIVATE_KEY: ${{ secrets.LEHU_GPG_PRIVATE_KEY }}
          LEHU_GPG_KEY: ${{ secrets.LEHU_GPG_KEY_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils
          echo "$LEHU_GPG_PRIVATE_KEY" | gpg --batch --import
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin gh-pages; then
            git worktree add -B gh-pages repo FETCH_HEAD
          else
            git worktree add --orphan -b gh-pages repo
          fi
          packaging/debian/apt-repo.sh repo dist/*.deb
          cd repo
          git add -A
          git commit -m "lehu ${GITHUB_REF_NAME}"
          # The token by name: checkout keeps its credentials for the main
          # working tree, not for this one.
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
