[package]
name = "lehu-maps"
description = "Puts LEHU's map regions and voice on the SD card from a PC: downloads OpenStreetMap extracts, builds them, writes and checks them"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/mbt28/lehu"
publish = false

# Its own workspace: the head unit's (the repository root) is built for the
# board, with its own patches; this is a desktop program.
[workspace]

[dependencies]
dirs = "6"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# winit with OpenGL (femtovg) on the desktop; the software renderer for
# --screenshot and as a fallback (SLINT_BACKEND=winit-software).
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility"] }
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
png = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Threading"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev]
opt-level = 1
