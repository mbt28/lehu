# meta-lehu: LEHU, the head unit, for Yocto/OpenEmbedded images.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "lehu"
BBFILE_PATTERN_lehu = "^${LAYERDIR}/"
BBFILE_PRIORITY_lehu = "6"

LAYERDEPENDS_lehu = "core"
LAYERSERIES_COMPAT_lehu = "wrynose"
