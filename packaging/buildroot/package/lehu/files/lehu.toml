# The image's layer of LEHU's settings: what is true of this system. The
# defaults below it are compiled in (config/lehu.toml in the source lists
# them all); the user's file above it is /var/lib/lehu/settings.toml,
# written from the screens.

[wifi]
# hostapd runs from this file (S44ap); LEHU hands its network to the phones.
interface = "wlan0"
hostapd-conf = "/etc/hostapd.conf"
# S44ap stop leaves the radio's transport loaded; only the AP restarts.
ap-restart-command = "sudo -n /etc/init.d/S44ap stop; sudo -n /etc/init.d/S44ap start"

[bluetooth]
name = "LEHU"

[system]
log-level = "info"
reboot-command = "sudo -n /sbin/reboot"
shutdown-command = "sudo -n /sbin/poweroff"
set-clock-command = "sudo -n /bin/date -u -s @{unix}"
