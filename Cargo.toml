[workspace]
resolver = "3"
members = ["lehu", "crates/lehu-aa", "crates/lehu-camera", "crates/lehu-core", "crates/lehu-cp", "crates/lehu-drm", "crates/lehu-input", "crates/lehu-session", "crates/lehu-ui", "crates/lehu-usb", "crates/lehu-video", "crates/lehu-audio", "crates/lehu-bt", "crates/lehu-wifi", "crates/lehu-fuzz", "crates/lehu-image", "crates/lehu-update"]

# ARMv5 has no 64-bit atomics: fontique's counter becomes 32 bits; and
# parley's dictionary segmenter (3 MB of tables for Thai, Khmer, Lao,
# Burmese and CJK word breaks) is left out of a binary that lives in 64 MB
# of RAM (vendor/).
[patch.crates-io]
fontique = { path = "vendor/fontique" }
parley = { path = "vendor/parley" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-or-later"
repository = "https://github.com/mbt28/lehu"

# The board has 64 MB of RAM, no FPU and a 408 MHz core: every byte of the
# binary is RAM at run time, so the release build is tuned for size.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.dev]
opt-level = 1
